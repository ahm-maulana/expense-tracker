UserResponse:
  type: object
  required:
    - data
  properties:
    data:
      type: object
      required:
        - id
        - name
        - email
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "../openapi.yaml#/components/schemas/UUID"
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        createdAt:
          $ref: "../openapi.yaml#/components/schemas/DateTime"
        updatedAt:
          $ref: "../openapi.yaml#/components/schemas/DateTime"

ChangePasswordRequest:
  type: object
  required:
    - currentPassword
    - newPassword
    - confirmPassword
  properties:
    currentPassword:
      type: string
      format: password
      example: Password123@
    newPassword:
      type: string
      format: password
      example: NewPassword123@
    confirmPassword:
      type: string
      format: password
      example: NewPassword123@
