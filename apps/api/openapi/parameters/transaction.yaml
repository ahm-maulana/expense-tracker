TransactionId:
  name: transactionId
  description: The unique identifier of the transaction
  in: path
  required: true
  schema:
    $ref: "../openapi.yaml#/components/schemas/UUID"

TransactionSearch:
  name: search
  description: Search by name or description
  in: query
  required: false
  schema:
    type: string
    example: Dinner

TransactionSortBy:
  name: sortBy
  in: query
  description: Field to sort by
  required: false
  schema:
    type: string
    enum:
      - title
      - createdAt
    example: createdAt
