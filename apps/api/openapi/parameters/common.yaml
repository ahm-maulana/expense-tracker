Page:
  name: page
  in: query
  description: Page number
  required: false
  schema:
    type: integer
    minimum: 1
    default: 1

Limit:
  name: limit
  in: query
  description: Number of items per page
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 10

OrderBy:
  name: orderBy
  in: query
  description: Sort direction
  required: false
  schema:
    type: string
    enum:
      - asc
      - desc
    default: desc
